name: EmuHub V20 Extra Media
on:
  push:
    branches: [chatgpt-emuhub-v19-assets]
    paths:
      - 'tools/emuhub_v20/**'
      - '.github/workflows/emuhub-v20-extra-media.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tools/emuhub_v20/**'
      - '.github/workflows/emuhub-v20-extra-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - name: Collect authentic extra hardware and gameplay
        run: python tools/emuhub_v20/fetch_extra_media.py
      - name: Package
        run: zip -r EmuHub_V20_Extra_Media.zip v20_extra_media
      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-V20-Extra-Media
          path: EmuHub_V20_Extra_Media.zip
          compression-level: 0
          retention-days: 7
