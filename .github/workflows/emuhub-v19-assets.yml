name: EmuHub V19 Source Media

on:
  push:
    branches: [chatgpt-emuhub-v19-assets]
    paths:
      - 'tools/emuhub_v19_assets.py'
      - '.github/workflows/emuhub-v19-assets.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tools/emuhub_v19_assets.py'
      - '.github/workflows/emuhub-v19-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - name: Collect authentic hardware and gameplay
        run: python tools/emuhub_v19_assets.py
      - name: Package
        run: python -c "import shutil; shutil.make_archive('EmuHub_V19_Theme_Source_Assets','zip','v19_source_assets')"
      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-V19-Theme-Source-Assets
          path: |
            EmuHub_V19_Theme_Source_Assets.zip
            v19_source_assets/asset_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
